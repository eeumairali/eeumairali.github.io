<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Umair Ali logo</title>
  <desc id="desc">A circular UA monogram for Umair Ali</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ed8c2"/>
      <stop offset="1" stop-color="#f4a77d"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#18232c" stroke="url(#accent)" stroke-width="5"/>
  <text x="48" y="59" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">UA</text>
</svg>